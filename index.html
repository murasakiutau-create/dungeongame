const chance = p => Math.random() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
function hash(x, y) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function weighted(list) { // [[value, weight], ...]
  let t = 0; for (const [, w] of list) t += w;
  let r = Math.random() * t;
  for (const [v, w] of list) { if ((r -= w) < 0) return v; }
  return list[0][0];
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function makeSprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = mk(w, h), g = c.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      const col = pal[r[x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  });
  return c;
}
function flip(src) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
function tinted(src, color, a) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-atop';

const SPELLS = [

// =====================================================================
//  一人称3D用テクスチャ（32×32 のドット絵をコードで生成）
// =====================================================================
function lcg(seed) { let s = seed | 0; return () => { s = (Math.imul(s, 1103515245) + 12345) | 0; return ((s >>> 8) & 0xffff) / 65536; }; }
const TS = 32;
const rgb = (r, g, b) => (0xff000000 | (clamp(b | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(r | 0, 0, 255)) >>> 0;
function makeTex(fn) { const t = new Uint32Array(TS * TS); for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) t[y * TS + x] = fn(x, y); return t; }
// レンガ（壁・天井）
function brickTex(seed, base, mortar, bw, bh) {
  return makeTex((x, y) => {
    const row = Math.floor(y / bh), off = (row % 2) * (bw >> 1);
    const lx = (x + off) % bw, ly = y % bh, bx = Math.floor(((x + off) % TS) / bw);
    if (ly === bh - 1 || lx === bw - 1) return rgb(...mortar);
    let k = .82 + (hash(row * 7 + bx, seed) % 28) / 100;
    if (ly === 0 || lx === 0) k += .2;
    else if (ly === bh - 2 || lx === bw - 2) k -= .2;
    k += ((hash(x + seed, y) % 9) - 4) / 60;
    if (hash(x * 7 + seed, y * 13) % 113 === 0) return rgb(201, 168, 255);   // 紫水晶のきらめき
    return rgb(base[0] * k, base[1] * k, base[2] * k);
  });
}
// 石畳（床）
function floorTex(seed) {
  return makeTex((x, y) => {
    const row = Math.floor(y / 8), bw = row % 2 ? 8 : 16, off = (row * 5) % 16;
    const lx = (x + off) % bw, ly = y % 8, bx = Math.floor(((x + off) % TS) / bw);
    if (ly === 7 || lx === bw - 1) return rgb(20, 12, 34);
    let k = .8 + (hash(row * 5 + bx, seed) % 30) / 100;
    if (ly === 0 || lx === 0) k += .22; else if (ly === 6 || lx === bw - 2) k -= .18;
    k += ((hash(x, y + seed) % 9) - 4) / 60;
    return rgb(64 * k, 48 * k, 98 * k);
  });
}
// 下り階段
function stairsTex() {
  const f = floorTex(5);
  return makeTex((x, y) => {
    if (x < 3 || x > 28 || y < 3 || y > 28) return f[y * TS + x];
    if (x === 3 || x === 28 || y === 3) return rgb(20, 12, 34);
    const st = Math.floor((y - 4) / 5), ly = (y - 4) % 5, k = 1 - st * .19;
    return ly === 0 ? rgb(215 * k, 195 * k, 255 * k) : rgb(120 * k, 96 * k, 170 * k);
  });
}
// 燭台つきの壁（紫の炎・2コマ）
function torchTex(frame) {
  const base = brickTex(11, [88, 66, 140], [34, 22, 56], 16, 8);
  const fw = [1, 1, 2, 2, 2, 3, 3, 3, 2, 2];
  return makeTex((x, y) => {
    const dx = x - 15.5, d = Math.hypot(dx, (y - 13) * 1.2);
    if (y >= 19 && y <= 21 && x >= 13 && x <= 18) return rgb(30, 20, 40);
    if (y >= 22 && y <= 25 && x >= 15 && x <= 16) return rgb(30, 20, 40);
    const fy = y - (frame ? 8 : 9);
    if (fy >= 0 && fy < 10 && Math.abs(dx) <= fw[fy]) {
      if (Math.abs(dx) <= fw[fy] - 1.5) return fy > 6 ? rgb(255, 255, 255) : rgb(230, 205, 255);
      return rgb(150, 90, 230);
    }
    const c = base[y * TS + x], g = Math.max(0, 1 - d / 14) * (frame ? .95 : .8);
    return rgb((c & 255) * (1 + g) + 40 * g, ((c >>> 8) & 255) * (1 + g * .6), ((c >>> 16) & 255) * (1 + g) + 30 * g);
  });
}
const TEX = {

// =====================================================================
//  ダンジョン生成（シレン風：3×3 区画に部屋＋通路）
// =====================================================================
const MW = 42, MH = 42, CS = 14;
function genFloor(d) {
  const tiles = new Uint8Array(MW * MH);
  const rooms = [];
  let dummies = 0;
  for (let cy = 0; cy < 3; cy++) for (let cx = 0; cx < 3; cx++) {
    if (dummies < 2 && chance(.18)) {
      rooms.push({ x: cx * CS + rand(3, CS - 4), y: cy * CS + rand(3, CS - 4), w: 1, h: 1, cx, cy, dummy: true });
      dummies++;
    } else {
      const w = rand(4, 9), h = rand(4, 8);
      rooms.push({ x: cx * CS + rand(2, CS - w - 2), y: cy * CS + rand(2, CS - h - 2), w, h, cx, cy });
    }
  }
  const set = (x, y, v) => { tiles[y * MW + x] = v; };
  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) set(x, y, 1);

  // 全区画をつなぐ（ランダムDFS）＋ループ用の追加通路
  const R = (cx, cy) => rooms[cy * 3 + cx];
  const edges = [], seen = new Set();
  (function dfs(cx, cy) {
    seen.add(cy * 3 + cx);
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].sort(() => Math.random() - .5);
    for (const [dx, dy] of nb) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx > 2 || ny > 2 || seen.has(ny * 3 + nx)) continue;
      edges.push([R(cx, cy), R(nx, ny)]); dfs(nx, ny);
    }
  })(rand(0, 2), rand(0, 2));
  for (let i = 0; i < 2; i++) {
    const cx = rand(0, 1), cy = rand(0, 2);
    if (chance(.5)) edges.push([R(cx, cy), R(cx + 1, cy)]); else edges.push([R(cy, cx), R(cy, cx + 1)]);
  }
  const hline = (y, xa, xb) => { for (let x = Math.min(xa, xb); x <= Math.max(xa, xb); x++) set(x, y, 1); };
  const vline = (x, ya, yb) => { for (let y = Math.min(ya, yb); y <= Math.max(ya, yb); y++) set(x, y, 1); };
  for (const [a, b] of edges) {
    const pa = { x: rand(a.x, a.x + a.w - 1), y: rand(a.y, a.y + a.h - 1) };
    const pb = { x: rand(b.x, b.x + b.w - 1), y: rand(b.y, b.y + b.h - 1) };
    if (a.cx !== b.cx) {
      const [L, Rr] = a.cx < b.cx ? [pa, pb] : [pb, pa];
      const mx = (Math.min(a.cx, b.cx) + 1) * CS - rand(0, 1);
      hline(L.y, L.x, mx); vline(mx, L.y, Rr.y); hline(Rr.y, mx, Rr.x);
    } else {
      const [T, B] = a.cy < b.cy ? [pa, pb] : [pb, pa];
      const my = (Math.min(a.cy, b.cy) + 1) * CS - rand(0, 1);
      vline(T.x, T.y, my); hline(my, T.x, B.x); vline(B.x, my, B.y);
    }
  }

  const real = rooms.filter(r => !r.dummy);
  const stairRoom = pick(real);
  const startRoom = pick(real.length > 1 ? real.filter(r => r !== stairRoom) : real);
  const inRoom = r => ({ x: rand(r.x, r.x + r.w - 1), y: rand(r.y, r.y + r.h - 1) });
  const stairs = inRoom(stairRoom);
  set(stairs.x, stairs.y, 2);
  let start; do { start = inRoom(startRoom); } while (start.x === stairs.x && start.y === stairs.y);

  const m = { w: MW, h: MH, tiles, rooms, stairs, start, items: [], torches: [], explored: new Uint8Array(MW * MH) };
  finalizeMap(m);

  // アイテム配置
  const used = new Set([stairs.y * MW + stairs.x, start.y * MW + start.x]);
  const place = obj => {
    for (let tries = 0; tries < 30; tries++) {
      const p = inRoom(pick(real)), k = p.y * MW + p.x;
      if (!used.has(k)) { used.add(k); m.items.push(Object.assign(obj, p)); return; }
    }
  };
  for (let i = rand(2, 4); i > 0; i--) place({ id: rollItem(d) });
  for (let i = rand(1, 3); i > 0; i--) place({ id: 'gold', amount: Math.round(rand(5, 14) * (1 + d * .3)) });

  // 燭台（紫の炎）
  for (const r of real) {
    for (let n = rand(1, 2); n > 0; n--) {
      if (chance(.5)) { const x = rand(r.x, r.x + r.w - 1), y = r.y - 1; if (!tiles[y * MW + x]) m.torches.push({ x, y }); }
      else { const x = r.x - 1, y = rand(r.y, r.y + r.h - 1); if (!tiles[y * MW + x]) m.torches.push({ x, y }); }
    }
  }
  return m;
}
function finalizeMap(m) {
  m.torchSet = new Set(m.torches.map(t => t.y * m.w + t.x));
}
const walkable = (x, y) => x >= 0 && y >= 0 && x < map.w && y < map.h && map.tiles[y * map.w + x] > 0;
function roomAt(x, y) {
  return map.rooms.find(r => !r.dummy && x >= r.x - 1 && x <= r.x + r.w && y >= r.y - 1 && y <= r.y + r.h);
}
// オートマップ：いる場所のまわりを記録（見えた範囲はレイキャスト中にも記録）
function updateVision() {
  const m = map, p = player;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const x = p.x + dx, y = p.y + dy;
    if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.explored[y * m.w + x] = 1;
  }
}

// =====================================================================
//  ゲーム状態
// =====================================================================
let mode = 'title';        // title / field / battle / gameover
let overlay = null;        // items / magic / confirm
let player = null, map = null, depth = 1, battle = null;
let busy = false;
let log = [];
let T = 0;
let fadeA = 0, fadeTarget = 0;
let parts = [], nums = [];
let shake = 0, flashT = -9999, flashCol = '#fff', lvupT = -9999, goT = 0;
let titleCursor = 0, lastCmd = 0;
let dirStack = [], pointer = { down: false, x: 0, y: 0, field: false, act: -1, touch: false }, pendingTurn = -1;
let hits = [];

titleMap.explored.fill(1);
map = titleMap;

function newPlayer() {
  return { name: 'ユウ', lv: 1, hp: 30, mhp: 30, mp: 10, mmp: 10, atk: 8, def: 3, exp: 0, next: 12, gold: 0,
    items: { herb: 2, water: 1 }, x: 0, y: 0, rx: 0, ry: 0, dir: 1, ang: 0, steps: 0, encStep: 0, safe: 3, moving: null, turning: null, bumpT: -9999 };
}

// ---------- メッセージ ----------
let skipWait = null;
function wait(ms, skippable = true) {
  return new Promise(res => {
    const done = () => { clearTimeout(t); if (skipWait === done) skipWait = null; res(); };
    const t = setTimeout(done, ms);
    if (skippable) skipWait = done;
  });
}
function note(text) { log.push({ text, t: T }); if (log.length > 30) log.shift(); }
async function say(text, ms = 650) { note(text); if (ms > 0) await wait(ms); }
async function fadeTo(v) { fadeTarget = v; await wait(320, false); }

// ---------- セーブ / ロード ----------
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function saveGame(silent) {
  try {
    const p = Object.assign({}, player, { moving: null, turning: null });
    const data = { v: 1, depth, player: p, map: {
      tiles: Array.from(map.tiles), explored: Array.from(map.explored), rooms: map.rooms,
      stairs: map.stairs, start: map.start, items: map.items, torches: map.torches } };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    if (!silent) { note('きろくを セーブしました。'); burst(240, 100, 16, ['#e0ccff', '#b89cff'], 1, 700, -.01); }
    return true;
  } catch (e) { note('セーブできませんでした…'); return false; }
}
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    player = Object.assign(newPlayer(), d.player, { moving: null, turning: null });
    player.ang = DIRANG[player.dir];
    player.rx = player.x; player.ry = player.y;
    depth = d.depth;
    const m = d.map;
    map = { w: MW, h: MH, tiles: Uint8Array.from(m.tiles), explored: Uint8Array.from(m.explored), rooms: m.rooms,
      stairs: m.stairs, start: m.start, items: m.items, torches: m.torches };
    finalizeMap(map);
    return true;
  } catch (e) { return false; }
}

// =====================================================================
//  ゲーム進行
// =====================================================================
function enterFloor() {
  map = genFloor(depth);
  player.x = player.rx = map.start.x; player.y = player.ry = map.start.y;
  player.moving = null; player.turning = null; player.safe = 3; player.encStep = 0;
  const open = [0, 1, 2, 3].filter(d => walkable(player.x + DIRS[d][0], player.y + DIRS[d][1]));
  player.dir = open.length ? pick(open) : 1; player.ang = DIRANG[player.dir];
  updateVision();
}
async function newGame() {
  busy = true;
  await fadeTo(1);
  player = newPlayer(); depth = 1; log = [];
  enterFloor(); mode = 'field'; overlay = null; battle = null;
  await fadeTo(0);
  note('ここは むらさきに ひかる めいきゅう…');
  note('↑で すすみ ←→で むきを かえる。');
  note('かいだんを さがそう！ M:マップ');
  busy = false;
}
async function continueGame() {
  busy = true;
  await fadeTo(1);
  if (!loadGame()) { await fadeTo(0); busy = false; note('セーブデータを よみこめませんでした'); return; }
  log = []; mode = 'field'; overlay = null; battle = null;
  updateVision();
  await fadeTo(0);
  note(`B${depth}F から ぼうけんを さいかいした。`);
  busy = false;
}
function toTitle() {
  mode = 'title'; map = titleMap; overlay = null; battle = null; busy = false; log = [];
  titleCursor = hasSave() ? 1 : 0;
}
async function descend() {
  overlay = null; busy = true;
  await fadeTo(1);
  depth++;
  enterFloor();
  saveGame(true);
  await fadeTo(0);
  note(`B${depth}F に おりた。（オートセーブ しました）`);
  busy = false;
}

// ---------- 移動（一人称：↑前進 ↓後退 ←→向きを変える） ----------
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];          // 北・東・南・西
const DIRANG = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
const DIRNAME = ['北', '東', '南', '西'];
const MOVE_MS = 190, TURN_MS = 170;
function tryAct(a) {     // 0:前進 1:右を向く 2:後退 3:左を向く
  const p = player;
  if (a === 1 || a === 3) {
    const s = a === 1 ? 1 : -1;
    p.turning = { from: p.ang, to: p.ang + s * Math.PI / 2, t: 0 };
    p.dir = (p.dir + s + 4) % 4;
    return;
  }
  const d = a === 0 ? p.dir : (p.dir + 2) % 4;
  const nx = p.x + DIRS[d][0], ny = p.y + DIRS[d][1];
  if (!walkable(nx, ny)) { if (a === 0 && T - p.bumpT > 400) p.bumpT = T; return; }
  p.moving = { fx: p.x, fy: p.y, t: 0 };
  p.x = nx; p.y = ny;
  updateVision();
}
function onArrive() {
  const p = player;
  p.steps++;
  if (p.steps % 3 === 0 && p.hp < p.mhp) p.hp++;
  if (p.steps % 8 === 0 && p.mp < p.mmp) p.mp++;
  const idx = map.items.findIndex(it => it.x === p.x && it.y === p.y);
  if (idx >= 0) {
    const it = map.items[idx]; map.items.splice(idx, 1);
    if (it.id === 'gold') { p.gold += it.amount; note(`${it.amount}G を ひろった！`); }
    else { p.items[it.id] = (p.items[it.id] || 0) + 1; note(`${ITEMS[it.id].name}を ひろった！`); }
    burst(240, 108, 10, ['#f2d27a', '#fff6c0'], 1, 500, -.01);
  }
  if (map.tiles[p.y * map.w + p.x] === 2) { dirStack = []; overlay = { type: 'confirm', cursor: 0 }; return; }
  if (p.safe > 0) { p.safe--; return; }
  p.encStep++;
  if (chance(Math.min(.2, .02 + p.encStep * .006))) startBattle();
}

// ---------- バトル ----------
function makeEnemy(d) {
  const pool = ENEMIES.filter(e => d >= e.min && d <= e.max);
  const b = weighted(pool.map(e => [e, e.w]));
  const k = 1 + (d - b.min) * .12 + (d - 1) * .04;
  const hp = Math.round(b.hp * k);
  return Object.assign({}, b, { hp, mhp: hp, atk: Math.round(b.atk * k), def: Math.round(b.def * k),
    exp: Math.round(b.exp * (1 + (d - 1) * .15)), gold: Math.round(b.gold * (1 + (d - 1) * .2)) });
}
const EX = 240, EY = 100;   // バトル画面での敵の中心
async function startBattle() {
  dirStack = []; pointer.field = false;
  const e = makeEnemy(depth);
  battle = { e, t0: T, cursor: lastCmd, hitT: -9999, heroAtkT: -9999, enemyAtkT: -9999, slashT: -9999,
    boltT: -9999, deadT: 0, defending: false };
  mode = 'battle'; busy = true;
  await wait(650, false);
  await say(`${e.name}が あらわれた！`, 500);
  busy = false;
}
function hitEnemy(dmg, col) {
  const e = battle.e;
  e.hp = Math.max(0, e.hp - dmg);
  battle.hitT = T; shake = 3;
  dmgNum(EX + rand(-10, 10), EY - 10, String(dmg), col || '#ffffff');
}
function hurtPlayer(dmg) {
  player.hp = Math.max(0, player.hp - dmg);
  if (dmg > 0) { shake = 7; flashT = T; flashCol = '#ff3060'; }
  dmgNum(80, 232, dmg > 0 ? String(dmg) : 'MISS', '#ff8aa8');
}
async function doCommand(i) {
  if (busy || !battle) return;
  lastCmd = battle.cursor = i;
  if (i === 2) { overlay = { type: 'magic', cursor: 0 }; return; }
  busy = true; battle.defending = false;
  if (i === 0) await heroAttack();
  else if (i === 1) {
    battle.defending = true;
    if (player.mp < player.mmp) player.mp++;
    await say(`${player.name}は みを まもっている。`);
  } else if (i === 3) {
    const rate = clamp(.55 + (player.lv - depth) * .05, .3, .9);
    await say(`${player.name}は にげだした！`, 450);
    if (chance(rate)) { await say('うまく にげきれた！', 500); endBattle(); busy = false; return; }
    await say('しかし まわりこまれてしまった！');
  }
  await afterPlayerAction();
}
async function heroAttack() {
  const e = battle.e;
  battle.heroAtkT = T;
  await wait(170, false);
  if (chance(e.evade || .04)) { await say(`${e.name}は ひらりと かわした！`); return; }
  const crit = chance(1 / 12);
  const dmg = crit ? Math.round(player.atk * 1.8 * (.95 + Math.random() * .1))
                   : Math.max(1, Math.round(player.atk * (.9 + Math.random() * .25) - e.def * .6));
  battle.slashT = T;
  hitEnemy(dmg, crit ? '#ffe080' : '#ffffff');
  if (crit) { flashT = T; flashCol = '#fff6c0'; await say('かいしんの いちげき！', 400); }
  await say(`${e.name}に ${dmg}の ダメージ！`);
}
async function castSpell(sp) {
  if (player.mp < sp.mp) { note('MPが たりない！'); return; }
  overlay = null; busy = true; battle.defending = false;
  player.mp -= sp.mp;
  await say(`${player.name}は ${sp.name}を となえた！`, 450);
  const pow = Math.round((sp.base + player.lv * sp.per) * (.9 + Math.random() * .2));
  if (sp.type === 'heal') {
    const a = Math.min(pow, player.mhp - player.hp);
    player.hp += a; healFx();
    await say(`HPが ${a} かいふくした！`);
  } else {
    const e = battle.e;
    if (sp.id === 'fire') burst(EX, EY + 10, 50, ['#ff9a5a', '#ffd27a', '#c060ff', '#ff5a8a'], 2.2, 800, -.02);
    if (sp.id === 'thunder') { battle.boltT = T; flashT = T; flashCol = '#fff8c0'; burst(EX, EY, 30, ['#fff8a0', '#ffffff', '#b8d0ff'], 2.5, 500, .02); }
    if (sp.id === 'meteor') {
      flashT = T; flashCol = '#ffb0f0'; shake = 10;
      for (let i = 0; i < 70; i++) parts.push({ x: EX + rand(-120, 60), y: rand(-60, 0), vx: 1.4 + Math.random(), vy: 2.6 + Math.random() * 1.5,
        t: 0, life: 700, color: pick(['#ff9a5a', '#ffd27a', '#e0ccff', '#c060ff']), size: rand(2, 4), g: .02 });
      setTimeout(() => burst(EX, EY + 10, 60, ['#ffd27a', '#ff9a5a', '#fff'], 3, 900, .01), 300);
    }
    await wait(380, false);
    let dmg = pow;
    const weak = e.weak === sp.id;
    if (weak) dmg = Math.round(dmg * 1.5);
    hitEnemy(dmg, '#ffd27a');
    if (weak) await say('こうかは ばつぐんだ！', 400);
    await say(`${e.name}に ${dmg}の ダメージ！`);
  }
  await afterPlayerAction();
}
async function afterPlayerAction() {
  if (battle.e.hp <= 0) { await victory(); return; }
  await enemyTurn();
  if (player.hp <= 0) { await defeat(); return; }
  busy = false;
}
function enemyDamage(mult) {
  let dmg = Math.max(1, Math.round(battle.e.atk * mult * (.9 + Math.random() * .25) - player.def * .7));
  if (battle.defending) dmg = Math.floor(dmg / 2);
  return dmg;
}
async function enemyTurn() {
  const e = battle.e, p = player;
  await wait(250, false);
  battle.enemyAtkT = T;
  await wait(200, false);
  const skill = e.skill && chance(e.skillRate) ? e.skill : null;
  if (skill === 'drain') {
    await say(`${e.name}は ぶきみに ささやいた…`, 450);
    const a = Math.min(p.mp, rand(2, 5));
    p.mp -= a; burst(60, 262, 14, ['#6aa8ff', '#b8d0ff'], 1.2, 600, -.01);
    await say(a ? `MPを ${a} すいとられた！` : 'しかし なにも おこらなかった。');
    return;
  }
  if (skill === 'darkfire') {
    await say(`${e.name}は ダークファイアを はなった！`, 400);
    burst(EX, EY + 60, 40, ['#8a3a9a', '#c060ff', '#2a1040', '#ff6ad0'], 2.5, 700, .01);
    let dmg = Math.round(e.atk * .85 * (.9 + Math.random() * .2));
    if (battle.defending) dmg = Math.floor(dmg / 2);
    hurtPlayer(dmg);
    await say(`${p.name}は ${dmg}の ダメージを うけた！`);
    return;
  }
  if (skill === 'double') {
    await say(`${e.name}は すばやく 2かい こうげきしてきた！`, 400);
    let total = 0;
    for (let i = 0; i < 2; i++) { const d = enemyDamage(.65); total += d; hurtPlayer(d); await wait(220, false); if (i === 0) battle.enemyAtkT = T; }
    await say(`${p.name}は あわせて ${total}の ダメージを うけた！`);
    return;
  }
  if (skill === 'crush') await say(`${e.name}は ちからを こめて なぐりかかった！`, 400);
  else await say(`${e.name}の こうげき！`, 300);
  if (chance(.05)) { hurtPlayer(0); await say(`${p.name}は ひらりと みをかわした！`); return; }
  const dmg = enemyDamage(skill === 'crush' ? 1.6 : 1);
  hurtPlayer(dmg);
  await say(`${p.name}は ${dmg}の ダメージを うけた！`);
}
async function victory() {
  const e = battle.e, p = player;
  battle.deadT = T;
  spriteParticles(e.sprite, EX - 40, EY - 40 + 2, 5);
  await wait(550, false);
  await say(`${e.name}を たおした！`);
  p.exp += e.exp; p.gold += e.gold;
  await say(`${e.exp}の けいけんちと ${e.gold}G を てにいれた！`);
  if (chance(e.drop)) {
    const id = rollItem(depth);
    p.items[id] = (p.items[id] || 0) + 1;
    await say(`${e.name}は ${ITEMS[id].name}を おとしていった！`);
  }
  while (p.exp >= p.next) await levelUp();
  await wait(250);
  endBattle(); busy = false;
}
async function levelUp() {
  const p = player;
  p.exp -= p.next; p.lv++;
  p.next = Math.round(p.next * 1.45 + 5);
  const a = rand(6, 9), b = rand(2, 4), c = 2, d = rand(1, 2);
  p.mhp += a; p.mmp += b; p.atk += c; p.def += d;
  p.hp = p.mhp; p.mp = p.mmp;
  lvupT = T; flashT = T; flashCol = '#fff0a0';
  burst(80, 250, 30, ['#f2d27a', '#fff6c0', '#e0ccff'], 1.8, 900, -.02);
  await say(`レベルが ${p.lv}に あがった！`, 900);
  await say(`HP+${a} MP+${b} こうげき+${c} ぼうぎょ+${d}`, 800);
  for (const s of SPELLS.filter(s => s.lv === p.lv)) await say(`${s.name}の まほうを おぼえた！`, 800);
}
async function defeat() {
  await say(`${player.name}は ちからつきた…`, 1100);
  mode = 'gameover'; goT = T; battle = null; busy = false;
}
function endBattle() {
  mode = 'field'; battle = null; overlay = null;
  player.encStep = 0; player.safe = 4;
}

// ---------- アイテム使用 ----------
function itemList() { return ITEM_ORDER.filter(id => player.items[id] > 0); }
function canUse(id) {
  if (id === 'herb' || id === 'bigherb') return player.hp < player.mhp;
  if (id === 'water') return player.mp < player.mmp;
  return true;
}
function applyItem(id) {
  const p = player;
  if (id === 'herb' || id === 'bigherb') { const a = Math.min(id === 'herb' ? 30 : 100, p.mhp - p.hp); p.hp += a; healFx(); return `HPが ${a} かいふくした！`; }
  if (id === 'water') { const a = Math.min(15, p.mmp - p.mp); p.mp += a; burst(60, 262, 16, ['#6aa8ff', '#e0f0ff'], 1.2, 700, -.02); return `MPが ${a} かいふくした！`; }
  if (id === 'seed') { p.atk++; return 'こうげきりょくが 1 あがった！'; }
  if (id === 'guard') { p.def++; return 'ぼうぎょりょくが 1 あがった！'; }
  return '';
}
async function useItem(id) {
  if (!canUse(id)) { note(id === 'water' ? 'MPは もう まんたんだよ。' : 'HPは もう まんたんだよ。'); return; }
  const inB = mode === 'battle';
  overlay = null; busy = true;
  player.items[id]--;
  await say(`${player.name}は ${ITEMS[id].name}を つかった！`, inB ? 450 : 0);
  await say(applyItem(id), inB ? 600 : 0);
  if (inB) { battle.defending = false; await afterPlayerAction(); } else busy = false;
}

// =====================================================================
//  エフェクト
// =====================================================================
function burst(x, y, n, colors, spd = 1.5, life = 600, g = .02) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd + .3;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .5, t: 0, life: life * (.6 + Math.random() * .6),
      color: pick(colors), size: pick([1, 1, 2, 2, 3]), g });
  }
}
function healFx() {
  burst(60, 250, 20, ['#9be07a', '#e0ffd0', '#c9a8ff'], 1.2, 800, -.02);
  if (mode === 'battle') burst(140, 185, 20, ['#9be07a', '#e0ffd0'], 1.2, 800, -.02);
}
const pixCache = new Map();
function spriteParticles(spr, x, y, scale) {
  let d = pixCache.get(spr);
  if (!d) { d = spr.getContext('2d').getImageData(0, 0, spr.width, spr.height).data; pixCache.set(spr, d); }
  for (let py = 0; py < spr.height; py++) for (let px = 0; px < spr.width; px++) {
    const i = (py * spr.width + px) * 4;
    if (d[i + 3] === 0 || !chance(.7)) continue;
    parts.push({ x: x + px * scale + scale / 2, y: y + py * scale + scale / 2, vx: (Math.random() - .5) * 1.4,
      vy: -Math.random() * 1.6 - .2, t: 0, life: 600 + Math.random() * 700,
      color: `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`, size: rand(2, 4), g: -.004 });
  }
}
function dmgNum(x, y, text, color) { nums.push({ x, y, text, color, t: T }); }
const motes = Array.from({ length: 38 }, () => ({ x: Math.random() * LW, y: Math.random() * 230, v: .1 + Math.random() * .25, p: Math.random() * 6 }));

// =====================================================================
//  入力
// =====================================================================
const KEYDIR = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
const isOK = k => k === 'Enter' || k === ' ' || k === 'z' || k === 'Z';
const isNG = k => k === 'Escape' || k === 'x' || k === 'X' || k === 'Backspace';
addEventListener('keydown', e => {
  const k = e.key;
  if (k in KEYDIR || k === ' ' || k === 'Tab') e.preventDefault();
  if (k in KEYDIR && !e.repeat) { dirStack = dirStack.filter(d => d !== KEYDIR[k]); dirStack.push(KEYDIR[k]); }
  onKey(k, e.repeat);
});
addEventListener('keyup', e => { if (e.key in KEYDIR) dirStack = dirStack.filter(d => d !== KEYDIR[e.key]); });
addEventListener('blur', () => { dirStack = []; });

function onKey(k, repeat) {
  if (skipWait && isOK(k)) { if (!repeat) skipWait(); return; }
  if (fadeA > .05) return;
  if (mode === 'title') {
    if (k === 'ArrowUp' || k === 'ArrowDown') titleCursor ^= 1;
    else if (isOK(k)) titleSelect(titleCursor);
    return;
  }
  if (mode === 'gameover') { if (isOK(k) && T - goT > 900) toTitle(); return; }
  if (overlay) { overlayKey(k); return; }
  if (busy) return;
  if (mode === 'battle') {
    if (k === 'ArrowLeft' || k === 'ArrowRight') battle.cursor ^= 1;
    else if (k === 'ArrowUp' || k === 'ArrowDown') battle.cursor ^= 2;
    else if (isOK(k) && !repeat) doCommand(battle.cursor);
    else if (k === 'i' || k === 'I') overlay = { type: 'items', cursor: 0 };
    return;
  }
  if (mode === 'field') {
    if (player.moving || player.turning) return;

// =====================================================================
//  更新
// =====================================================================
function update(dt) {

  if (player && player.turning) {
    const tr = player.turning;
    tr.t += dt;
    const k = Math.min(1, tr.t / TURN_MS), e = k * k * (3 - 2 * k);
    player.ang = tr.from + (tr.to - tr.from) * e;
    if (k >= 1) { player.ang = tr.to; player.turning = null; }
  }
  if (player && player.moving) {
    const m = player.moving;
    m.t += dt;
    const k = Math.min(1, m.t / MOVE_MS), e = k * k * (3 - 2 * k);
    player.rx = m.fx + (player.x - m.fx) * e;
    player.ry = m.fy + (player.y - m.fy) * e;
    if (k >= 1) { player.moving = null; player.rx = player.x; player.ry = player.y; if (mode === 'field') onArrive(); }
  }
  if (mode === 'field' && !busy && !overlay && !player.moving && !player.turning && fadeA < .05) {
    let a = dirStack.length ? dirStack[dirStack.length - 1] : -1;
    if (a < 0 && pendingTurn >= 0) a = pendingTurn;
    if (a < 0 && pointer.down && pointer.field) { a = pointerAct(); if (a === 1 || a === 3) a = -1; }
    pendingTurn = -1;
    if (a >= 0) tryAct(a);
  }

  for (const p of parts) { p.t += dt; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += p.g * dt / 16; p.vx *= .99; }
  parts = parts.filter(p => p.t < p.life);
  nums = nums.filter(n => T - n.t < 1100);
  shake = Math.max(0, shake - dt / 40);
  for (const m of motes) { m.y -= m.v * dt / 16; m.x += Math.sin((T / 1000) + m.p) * .1; if (m.y < -4) { m.y = 232; m.x = Math.random() * LW; } }
}

// =====================================================================
//  ダンジョン描画
// =====================================================================
const VW = 240, VH = 112;                     // 3D ビューの内部解像度（ドット感のため低解像度）
const view = mk(VW, VH), vctx = view.getContext('2d');
const vimg = vctx.createImageData(VW, VH), vbuf = new Uint32Array(vimg.data.buffer);

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const FOGC = rgb(7, 4, 12);
const light = d => clamp(1.3 - d / 5.5, 0, 1);
function shadeC(c, s, x, y) {   // 距離で暗く（ディザで段階的に）
  s = Math.floor(s * 9 + BAYER[(y & 3) * 4 + (x & 3)] / 16) / 9;

function renderView(px, py, ang, record) {

  // 床と天井
  const rx0 = dx - plx, ry0 = dy - ply, rx1 = dx + plx, ry1 = dy + ply;
  for (let y = half; y < VH; y++) {
    const rowD = half / (y - half + .5);
    const sx = rowD * (rx1 - rx0) / VW, sy = rowD * (ry1 - ry0) / VW;
    let fx = px + rowD * rx0, fy = py + rowD * ry0;
    const s = light(rowD), yc = VH - 1 - y;
    for (let x = 0; x < VW; x++) {
      const cx = Math.floor(fx), cy = Math.floor(fy);
      const ti = ((Math.floor((fy - cy) * TS) & 31) * TS) + (Math.floor((fx - cx) * TS) & 31);
      const t = (cx >= 0 && cy >= 0 && cx < W && cy < H) ? m.tiles[cy * W + cx] : 0;
      vbuf[y * VW + x] = shadeC((t === 2 ? TEX.stairs : TEX.floor)[ti], s, x, y);
      vbuf[yc * VW + x] = shadeC(TEX.ceil[ti], s * .75, x, yc);
      fx += sx; fy += sy;
    }
  }
  // 壁（DDA）

    const cam = 2 * (x + .5) / VW - 1;

    if (rdx < 0) { stx = -1; sdx = (px - mx) * ddx; } else { stx = 1; sdx = (mx + 1 - px) * ddx; }
    if (rdy < 0) { sty = -1; sdy = (py - my) * ddy; } else { sty = 1; sdy = (my + 1 - py) * ddy; }
    let side = 0, hitK = -1;
    for (let i = 0; i < 80; i++) {
      if (sdx < sdy) { sdx += ddx; mx += stx; side = 0; } else { sdy += ddy; my += sty; side = 1; }
      if (mx < 0 || my < 0 || mx >= W || my >= H) break;
      const k = my * W + mx;

      if (m.tiles[k] === 0) { hitK = k; break; }
    }
    const pd = Math.max(.05, side === 0 ? sdx - ddx : sdy - ddy);
    zbuf[x] = pd;

    wx -= Math.floor(wx);

    if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) tx = TS - 1 - tx;
    const torch = hitK >= 0 && m.torchSet.has(hitK);
    const tex = torch ? TEX.torch[tf] : TEX.wall[hash(mx, my) % 3];

      const ty = Math.floor((y + .5 - top) / lh * TS) & 31;

    }

  const list = [];

  if (record && m.stairs) list.push({ x: m.stairs.x + .5, y: m.stairs.y + .5, d: SPRD.mark, sc: .2, lift: .3 + Math.sin(T / 250) * .04 });

  list.sort((a, b) => b.dist - a.dist);

    const sx = o.x - px, sy = o.y - py;

    const scrX = (VW / 2) * (1 + tX / tY);

    const x0 = Math.max(0, Math.floor(scrX - w / 2)), x1 = Math.min(VW, Math.ceil(scrX + w / 2));
    const ya = Math.max(0, Math.floor(topY)), yb = Math.min(VH, Math.ceil(bottom));
    const s = Math.min(1, light(tY) + .15);
    for (let x = x0; x < x1; x++) {
      if (zbuf[x] < tY) continue;
      const u = Math.floor((x + .5 - (scrX - w / 2)) / w * o.d.w);
      if (u < 0 || u >= o.d.w) continue;
      for (let y = ya; y < yb; y++) {
        const v = Math.floor((y + .5 - topY) / size * o.d.h);
        if (v < 0 || v >= o.d.h) continue;
        const c = o.d.px[v * o.d.w + u];
        if ((c >>> 24) === 0) continue;

  }

}

  const inView = (x, y) => x >= cx0 && y >= cy0 && x < cx0 + cols && y < cy0 + rows;
  const st = m.stairs;
  if (inView(st.x, st.y) && m.explored[st.y * m.w + st.x]) { const [X, Y] = at(st.x, st.y); tri(X, Y, cs > 4 ? 2 : 1, 2, '#c9a8ff'); }
  for (const it of m.items) {
    if (!inView(it.x, it.y) || !m.explored[it.y * m.w + it.x]) continue;
    const [X, Y] = at(it.x, it.y);
    ctx.fillStyle = it.id === 'gold' ? '#f2d27a' : '#9be07a'; ctx.fillRect(X - 1, Y - 1, 2, 2);
  }
  if (inView(player.x, player.y)) { const [X, Y] = at(player.x, player.y); tri(X, Y, cs > 4 ? 2 : 1, player.dir, '#ff4a6a'); }
}
function drawHUD() {
  panel(6, 6, 74, 20, .85);
  txt(`B${depth}F`, 14, 11, '#f2d27a');
  txt(`${DIRNAME[player.dir]}向き`, 72, 11, '#e0ccff', 8, 'right');
  // ミニ・オートマップ（タップで全体マップ）
  const mx = LW - 92, my = 6;
  panel(mx, my, 88, 88, .75);
  drawAutomap(mx + 2, my + 2, 4, player.x - 10, player.y - 10, 21, 21);
  txt('M:マップ', mx + 44, my + 91, '#8f7bb8', 8, 'center');
  if (mode === 'field' && !overlay && !busy) hit(mx, my, 88, 100, () => { dirStack = []; overlay = { type: 'map' }; });
  // タッチ操作のガイド
  if (pointer.touch && mode === 'field' && !overlay) {
    ctx.globalAlpha = .35;
    txt('◀', 16, 106, '#e0ccff', 12); txt('▶', 452, 106, '#e0ccff', 12);
    txt('▲', 240, 150, '#e0ccff', 12, 'center'); txt('▼', 240, 200, '#e0ccff', 12, 'center');
    ctx.globalAlpha = 1;
  }
}

// ---------- バトル画面 ----------
function drawBattle() {
  const b = battle, t = T - b.t0, e = b.e;
  // エンカウント演出（点滅）
  if (t < 360) { ctx.fillStyle = `rgba(230,210,255,${(Math.floor(t / 60) % 2) * .7})`; ctx.fillRect(0, 0, LW, LH); }
  const k = clamp((t - 300) / 300, 0, 1);
  ctx.fillStyle = `rgba(7,4,12,${.6 * k})`; ctx.fillRect(0, 0, LW, LH);
  if (k <= 0) return;
  const BW = 280, BH = Math.round(196 * k), BX = 100, BY = 16 + Math.round((196 - BH) / 2);
  const g = ctx.createRadialGradient(240, 110, 10, 240, 110, 170);
  g.addColorStop(0, '#3a2466'); g.addColorStop(.6, '#1c1034'); g.addColorStop(1, '#0c0616');
  ctx.fillStyle = g; ctx.fillRect(BX, BY, BW, BH);
  panel(BX - 2, BY - 2, BW + 4, BH + 4, 0);
  if (k < 1) return;
  ctx.save(); ctx.beginPath(); ctx.rect(BX, BY, BW, BH); ctx.clip();
  // 背景のきらめき
  for (let i = 0; i < 24; i++) {
    const sx = BX + (hash(i, 7) % BW), sy = BY + (hash(i, 3) % 120);
    if ((Math.floor(T / 200) + i) % 5 === 0) continue;
    ctx.fillStyle = i % 3 ? '#5a4390' : '#b89cff'; ctx.fillRect(sx, sy, 1, 1);
  }
  // 床（アイソ）
  isoFill(240, 150, 110, 26, '#241a3c');
  isoFill(240, 150, 100, 22, '#2e2148');
  isoFill(240, 142, 38, 7, 'rgba(0,0,0,.45)');
  // 敵
  if (!b.deadT) {
    const bob = Math.round(Math.sin(T / (e.id === 'bat' ? 120 : 400)) * (e.id === 'ghost' ? 4 : 2));
    let ex = EX - 40, ey = EY - 40 + bob;
    const ht = T - b.hitT;
    if (ht < 300) ex += Math.round(Math.sin(ht / 20) * 4 * (1 - ht / 300));
    const at = T - b.enemyAtkT;
    if (at < 300) ey += Math.round(Math.sin(at / 300 * Math.PI) * 10);
    const white = ht < 240 && Math.floor(ht / 60) % 2 === 0;
    ctx.drawImage(white ? e.white : e.sprite, ex, ey, 80, 80);
  }
  // 斬撃
  const st = T - b.slashT;
  if (st < 220) {
    const p = st / 220;
    ctx.fillStyle = `rgba(255,255,255,${1 - p})`;
    for (let j = -1; j <= 1; j++) for (let i = 0; i < 40 * Math.min(1, p * 2); i++)
      ctx.fillRect(EX + 24 - i * 1.5 + j * 8, EY - 30 + i * 1.5, 2, 2);
  }
  // 雷
  const bt = T - b.boltT;
  if (bt < 300) {
    ctx.fillStyle = bt % 80 < 40 ? '#fff8c0' : '#b8d0ff';
    let lx = EX; for (let yy = BY; yy < EY + 20; yy += 6) { const nx = EX + rand(-10, 10); ctx.fillRect(Math.min(lx, nx), yy, Math.abs(nx - lx) + 3, 6); lx = nx; }
  }
  // 主人公（後ろ姿）
  const ht2 = T - b.heroAtkT;
  const lunge = ht2 < 260 ? Math.sin(ht2 / 260 * Math.PI) : 0;
  isoFill(134 + lunge * 24, 206 - lunge * 8, 16, 4, 'rgba(0,0,0,.45)');
  ctx.drawImage(heroBack[0][0], Math.round(116 + lunge * 24), Math.round(166 - lunge * 8 + (b.defending ? 2 : 0)), 36, 42);
  if (b.defending) { ctx.strokeStyle = `rgba(160,200,255,${.4 + .2 * Math.sin(T / 150)})`; ctx.lineWidth = 1; ctx.strokeRect(112, 162, 44, 48); }
  ctx.restore();
  // 敵の名前と HP
  if (!b.deadT) {
    panel(170, 22, 140, 22, .9);
    txt(e.name, 240, 25, '#ecdfff', 8, 'center');
    bar(182, 37, 116, 3, e.hp / e.mhp, '#c060ff', '#e0ccff');
  }
}
function drawOverlay() {
  const o = overlay;
  if (o.type === 'map') {
    const cs = 5, W = map.w * cs, x = Math.floor((LW - W) / 2), y = 9;
    ctx.fillStyle = 'rgba(7,4,12,.6)'; ctx.fillRect(0, 0, LW, 224);
    panel(x - 5, y - 5, W + 10, W + 10);
    drawAutomap(x, y, cs, 0, 0, map.w, map.h);
    panel(14, 14, 104, 46);
    txt(`地下 ${depth}階`, 66, 21, '#ecdfff', 12, 'center');
    txt('M / Esc：とじる', 66, 43, '#8f7bb8', 8, 'center');
    hit(0, 0, LW, 224, () => { overlay = null; });
    return;
  }
  if (o.type === 'confirm') {
    panel(160, 70, 160, 60);
    txt('かいだんが ある。', 240, 80, '#ecdfff', 8, 'center');
    txt('したの かいへ おりますか？', 240, 92, '#ecdfff', 8, 'center');
    ['はい', 'いいえ'].forEach((s, i) => {
      const bx = 196 + i * 58, by = 110;
      if (o.cursor === i) cursorArrow(bx - 10, by);
      txt(s, bx, by, o.cursor === i ? '#ffffff' : '#8f7bb8');
      hit(bx - 12, by - 3, 50, 14, () => { o.cursor = i; overlayKey('Enter'); }, () => { o.cursor = i; });
    });
    return;
  }
  if (o.type === 'magic') {
    const list = learned(), h = 22 + list.length * 14;
    const x = 324, y = 222 - h;
    panel(x, y, 150, h);
    txt('まほう', x + 10, y + 6, '#8f7bb8');
    list.forEach((sp, i) => {
      const yy = y + 18 + i * 14, ok = player.mp >= sp.mp;
      if (o.cursor === i) cursorArrow(x + 8, yy);
      txt(sp.name, x + 20, yy, ok ? (o.cursor === i ? '#ffffff' : '#cbb8f0') : '#5a4a7a');
      txt(`MP ${sp.mp}`, x + 140, yy, ok ? '#6aa8ff' : '#3a4a6a', 8, 'right');
      hit(x + 4, yy - 2, 142, 13, () => { o.cursor = i; overlayKey('Enter'); }, () => { o.cursor = i; });
    });
    return;
  }
  // どうぐ
  const list = itemList(), x = 150, y = 34, w = 180, h = Math.max(70, 44 + list.length * 14);
  panel(x, y, w, h);
  txt('どうぐ', x + 10, y + 7, '#8f7bb8');
  txt(mode === 'battle' ? '（つかうと 1ターン）' : 'Esc:とじる', x + w - 10, y + 7, '#6b56a0', 8, 'right');
  if (!list.length) txt('なにも もっていない…', x + 20, y + 26, '#8f7bb8');
  list.forEach((id, i) => {
    const yy = y + 22 + i * 14;
    if (o.cursor === i) cursorArrow(x + 8, yy);
    ctx.drawImage(ITEM_SPR[id], x + 18, yy);
    txt(ITEMS[id].name, x + 30, yy, o.cursor === i ? '#ffffff' : '#cbb8f0');
    txt(`×${player.items[id]}`, x + w - 12, yy, '#f2d27a', 8, 'right');
    hit(x + 4, yy - 2, w - 8, 13, () => { o.cursor = i; overlayKey('Enter'); }, () => { o.cursor = i; });
  });
  if (list.length) txt(ITEMS[list[Math.min(o.cursor, list.length - 1)]].desc, x + 12, y + h - 14, '#9be07a');
}

// ---------- タイトル / ゲームオーバー ----------
function drawTitle() {
  drawView(true);
  drawMotes();
  drawVignette();
  ctx.fillStyle = 'rgba(7,4,12,.35)'; ctx.fillRect(0, 0, LW, LH);
  const gy = 48 + Math.round(Math.sin(T / 800) * 2);
  ctx.save();
  ctx.shadowColor = '#9b6ae0'; ctx.shadowBlur = 12;
  txt('紫晶の迷宮', 240, gy, '#f0e6ff', 30, 'center');
  ctx.restore();
  txt('― AMETHYST LABYRINTH ―', 240, gy + 38, '#b89cff', 8, 'center');
  isoFill(240, 158, 12, 3, 'rgba(0,0,0,.5)');
  ctx.drawImage(heroFront[0][0], 222, 116 + (Math.sin(T / 450) > .6 ? -2 : 0), 36, 42);
  const save = hasSave();
  panel(176, 172, 128, 50);
  ['はじめから', 'つづきから'].forEach((s, i) => {
    const y = 184 + i * 16, on = i === 0 || save;
    if (titleCursor === i) cursorArrow(196, y);
    txt(s, 208, y, !on ? '#4f3f70' : titleCursor === i ? '#ffffff' : '#cbb8f0');
    hit(180, y - 3, 120, 15, () => { titleCursor = i; titleSelect(i); }, () => { titleCursor = i; });
  });
  txt('やじるしキー：えらぶ   Enter / Z：けってい', 240, 290, '#8f7bb8', 8, 'center');
  txt(save ? 'セーブデータ あり' : '', 240, 302, '#6b56a0', 8, 'center');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(20,4,16,.78)'; ctx.fillRect(0, 0, LW, LH);
  ctx.save(); ctx.shadowColor = '#c02060'; ctx.shadowBlur = 10;
  txt('GAME OVER', 240, 90, '#ffb0c8', 24, 'center');
  ctx.restore();
  txt(`B${depth}F で ${player.name}は ちからつきた…`, 240, 132, '#ecdfff', 8, 'center');
  txt('でも だいじょうぶ。 さいごの セーブから やりなおせるよ。', 240, 150, '#cbb8f0', 8, 'center');
  if (T - goT > 900 && Math.floor(T / 500) % 2) txt('Enter で タイトルへ', 240, 186, '#f2d27a', 8, 'center');
}

// =====================================================================
//  メインループ
// =====================================================================
function draw() {
  hits = [];
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#07040c'; ctx.fillRect(0, 0, LW, LH);
  if (mode === 'title') {
    drawTitle();
  } else {
    ctx.save();
    if (shake > 0) ctx.translate(Math.round((Math.random() - .5) * shake), Math.round((Math.random() - .5) * shake));
    drawView(false);
    drawMotes();
    drawVignette();
    if (mode === 'battle' && battle) drawBattle();
    ctx.restore();
    drawHUD();
    drawStatus();
    drawMessages();
    drawCommands();
    if (overlay) drawOverlay();
    if (mode === 'gameover') drawGameOver();
  }
  // パーティクル
  for (const p of parts) {
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
  // ダメージ数字
  for (const n of nums) {
    const t = T - n.t, up = Math.min(t / 250, 1) * 14 - (t > 250 && t < 400 ? Math.sin((t - 250) / 150 * Math.PI) * 3 : 0);
    ctx.globalAlpha = t > 750 ? clamp(1 - (t - 750) / 350, 0, 1) : 1;
    ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#1a0f26';
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.fillText(n.text, n.x + dx, n.y - up + dy);
    ctx.fillStyle = n.color; ctx.fillText(n.text, n.x, n.y - up);
    ctx.globalAlpha = 1;
  }
  // レベルアップ文字
  const lt = T - lvupT;
  if (lt < 1400) {
    ctx.globalAlpha = lt > 1000 ? 1 - (lt - 1000) / 400 : 1;
    ctx.save(); ctx.shadowColor = '#f2d27a'; ctx.shadowBlur = 8;
    txt('LEVEL UP!', 240, 70 - Math.min(lt / 300, 1) * 10, '#fff6c0', 20, 'center');
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // フラッシュ
  const ft = T - flashT;
  if (ft < 200) { ctx.globalAlpha = (1 - ft / 200) * .45; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
  if (fadeA > 0) { ctx.fillStyle = `rgba(7,4,12,${fadeA})`; ctx.fillRect(0, 0, LW, LH); }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(50, now - last); last = now; T += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
titleCursor = hasSave() ? 1 : 0;
cv.focus();
requestAnimationFrame(loop);
</script>
